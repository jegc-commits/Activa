name: Build Flutter Web to /docs

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "stable"
          channel: "stable"

      - name: Habilitar Web y obtener dependencias
        run: |
          flutter config --enable-web
          flutter pub get

      - name: Compilar Flutter Web para GitHub Pages
        run: flutter build web --release --base-href "/Activa/"

      - name: Copiar compilado a la carpeta docs/
        run: |
          rm -rf docs
          mkdir -p docs
          cp -r build/web/* docs/

      - name: Subir carpeta docs/ a main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "Sin cambios en docs/"
          else
            git commit -m "Actualiza build web en /docs"
            git push
          fi

  
flutter build web --release --base-href "/Activa/"        